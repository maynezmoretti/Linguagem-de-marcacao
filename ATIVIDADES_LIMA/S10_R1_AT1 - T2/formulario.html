<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Formulário - Pesquisa de Satisfação</title>
</head>
<body>
    <h1>Pesquisa de Satisfação</h1>
    <p>Preencha o formulário abaixo para avaliar nossos serviços!</p>
    <form action="">

        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" name="nome" required placeholder="Digite seu nome completo">
            <br><br>

        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email" required placeholder="Digite seu e-mail">
            <br><br>

        <label for="telefone">Telefone:</label><br>
        <input type="tel" id="telefone" name="telefone" required placeholder="Digite seu telefone">
            <br><br>

        <label for="idade">Idade:</label><br>
        <input type="number" min="16" max="120" id="idade" name="idade" required placeholder="Digite sua idade">
            <br><br>

        <label>Avaliação Geral:</label><br>

        <input type="radio" id="otimo" name="avaliacao" value="otimo">
        <label for="otimo">Ótimo</label><br>

        <input type="radio" id="bom" name="avaliacao" value="bom">
        <label for="bom">Bom</label><br>

        <input type="radio" id="regular" name="avaliacao" value="regular">
        <label for="regular">Regular</label><br>

        <input type="radio" id="ruim" name="avaliacao" value="ruim">
        <label for="ruim">Ruim</label>
            <br><br>

        <label>Serviços Utilizados:</label><br>

        <input type="checkbox" id="atendimento" name="servicos" value="atendimento">
        <label for="atendimento">Atendimento</label><br>

        <input type="checkbox" id="suporte" name="servicos" value="suporte">
        <label for="suporte">Suporte</label><br>

        <input type="checkbox" id="treinamento" name="servicos" value="treinamento">
        <label for="treinamento">Treinamento</label><br>

        <input type="checkbox" id="consultoria" name="servicos" value="consultoria">
        <label for="consultoria">Consultoria</label>
            <br><br>

        <label for="unidade">Unidade Atendida:</label><br>

        <select id="unidade" name="unidade">
            <option value="">Selecione uma unidade</option>
            <option value="americana">Americana</option>
            <option value="campinas">Campinas</option>
            <option value="sao-paulo">São Paulo</option>
        </select>
            <br><br>

        <label for="comentario">Comentários ou sugestões:</label><br>
        <textarea id="comentario" name="comentario" rows="5" cols="40"></textarea>
            <br><br>

        <input type="submit" value="Enviar Avaliação">
</form>
</body>
</html>
