<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 2</title>
    <style>
        body {
            background-color: aliceblue;
        }
        h1 {
            color: palevioletred;
            background-color: plum;
        }
        p {
            color: palevioletred;
            background-color: plum;
        }
    </style>
</head>
<body>
    <h1>
        Segunda utilização do CSS - Tag Style
    </h1>
    <p>
        Testando a tag style na minha página HTML
    </p>
    <p style="background-color: palevioletred; color: aliceblue;">
        Este é um 2º parágrafo, ele também está estilizado
    </p>
</body>
</html>
