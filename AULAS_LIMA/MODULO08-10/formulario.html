<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Cadastro de Cliente</h1>
    <form action="">

        <label for="nome">
            Nome:
        </label> <br>
        <input type="text"
                id="nome"
                name="nome"
                required
                placeholder="Digite seu nome completo">
                <br> <br>

        <label for="email">
            E-mail:
        </label> <br>
        <input type="email"
                id="email"
                name="email"
                required
                placeholder="Digite seu e-mail">
                <br> <br>

        <label for="idade">
            Idade:
        </label> <br>
        <input type="number"
                min="16"
                max="120"
                id="idade"
                name="idade">
                <br> <br>

        <label for="telefone">
            Telefone:
        </label> <br>
        <input type="tel"
                id="telefone"
                pattern="[0-9]{11}"
                placeholder="(00) 00000-0000">
                <br> <br>

        <button type="submit">
            Cadastrar
        </button>

    </form>
</body>
</html>
